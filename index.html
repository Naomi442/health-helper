
<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>健康小助手</title><style>:root{--b:#3978ed;--ink:#1d2b45}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fff1f6,#eef4ff);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:var(--ink)}.app{max-width:680px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#f7f9ffcc}.top{padding:18px 20px;background:#ffffffbd;display:flex;gap:14px;align-items:center}.top b{font-size:19px}.top small{display:block;color:#8c96a9;margin-top:4px}.chat{flex:1;overflow:auto;padding:20px}.welcome,.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 26px #7180a126}.welcome{background:linear-gradient(130deg,#fff,#fff3fa,#edf7ff)}.welcome h2{margin:0 0 8px;font-size:20px}.welcome p{color:#69758b;font-size:13px;line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.service,.chip{border:1px solid #e7ebf4;background:#fff;color:#34445f;border-radius:16px;padding:12px;text-align:left}.service b{display:block;margin:5px 0}.service small{color:#8993a5}.msg{display:flex;margin:14px 0}.msg.user{justify-content:flex-end}.user div{padding:11px 15px;border-radius:18px 18px 5px;background:linear-gradient(135deg,#ffd9e8,#cfe8ff)}.answer{background:#fff;border-radius:18px 18px 18px 5px;padding:17px;box-shadow:0 8px 26px #7180a126;line-height:1.7;font-size:14px}.answer h3{font-size:16px;margin:16px 0 8px}.answer p{margin:0 0 10px}.answer ul{padding-left:20px}.answer li{margin:6px 0}.danger,.warning{padding:11px;border-radius:12px;margin:12px 0}.danger{background:#fff0f1;color:#a43744}.warning{background:#fff7e5;color:#80601b}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border-radius:999px;padding:8px 12px}.composer{padding:10px 14px 16px;background:#ffffffcc}.quick{display:flex;gap:7px;overflow:auto;margin-bottom:9px}.quick button{white-space:nowrap;border:0;background:#fff;padding:9px 12px;border-radius:99px;color:#42516d}.row{display:flex;gap:8px;background:white;padding:8px;border-radius:18px}.row input{flex:1;border:0;outline:0;padding:8px}.row button{background:var(--b);color:white;border:0;border-radius:12px;padding:8px 13px}</style><main class="app"><header class="top"><span>‹</span><div><b>健康小助手</b><small>内容由 AI 生成</small></div></header><section class="chat" id="chat"><div class="welcome"><h2>您好，我是你的健康小助手</h2><p>可以帮你梳理症状、解读健康信息，并提示何时需要及时就医。</p></div><div class="grid"><button class="service" data-q="我想进行症状自查">🩺<b>症状自查</b><small>用几个问题梳理方向</small></button><button class="service" data-q="我需要解读一份体检报告">📄<b>报告单解读</b><small>了解指标常见含义</small></button><button class="service" data-q="我想咨询用药注意事项">💊<b>用药咨询</b><small>关注禁忌与红线</small></button><button class="service" data-q="我想获得饮食与作息建议">🌿<b>健康管理</b><small>饮食、睡眠与运动</small></button></div></section><footer class="composer"><div class="quick"><button data-q="问真人医生">👨‍⚕️问真人医生</button><button data-q="我需要解读报告单">📄报告单解读</button><button data-q="每日健康运势">🔮每日健康运势</button></div><div class="row"><input id="input" placeholder="发消息或按住说话..."><button id="send">发送</button></div></footer></main><script>const chat=document.querySelector('#chat'),input=document.querySelector('#input'),history=[],facts=[];const esc=s=>s.replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));async function ask(q,label=q){chat.insertAdjacentHTML('beforeend',`<div class="msg user"><div>${esc(label)}</div></div><div class="msg wait"><article class="answer">正在输入……</article></div>`);chat.scrollTop=chat.scrollHeight;const wait=chat.lastElementChild;try{const r=await fetch('/api/health-bot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({userInput:q,conversation:history,healthSummary:facts.map(x=>'- '+x).join('\n')})});const d=await r.json();if(!r.ok)throw Error(d.error);history.push({role:'user',content:q},{role:'assistant',content:d.text});wait.innerHTML='<article class="answer">'+render(d.text)+'</article>';bind(wait)}catch(e){wait.innerHTML='<article class="answer">暂时无法回答，请稍后再试</article>'}chat.scrollTop=chat.scrollHeight}function render(t){let h=esc(t).replace(/^([一二三四五六七八九十]+、.*)$/gm,'<h3>$1</h3>').replace(/^🔴 (.*)$/gm,'<div class="danger">🔴 $1</div>').replace(/^⚠️ (.*)$/gm,'<div class="warning">⚠️ $1</div>').replace(/^- (.*)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>(\n|$))+/g,m=>'<ul>'+m+'</ul>').replace(/\n/g,'<br>');const ops=[...t.matchAll(/[【[]([^】]]+)[】]]/g)].map(x=>x[1]).slice(0,5);if(ops.length)h+='<div class="chips">'+ops.map(x=>`<button class="chip" data-choice="${esc(x)}">${esc(x)}</button>`).join('')+'</div>';return h}function bind(root){root.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{facts.push(b.dataset.choice);ask('补充信息：'+b.dataset.choice,b.dataset.choice)})}document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>ask(b.dataset.q,b.textContent));document.querySelector('#send').onclick=()=>{if(input.value.trim()){ask(input.value);input.value=''}};input.onkeydown=e=>{if(e.key==='Enter')document.querySelector('#send').click()}</script></html>
